services:
  backend:
    build:
      context: ./realtime_transcriber
      dockerfile: Dockerfile
    container_name: realtime-backend
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_RT_URL: wss://api.openai.com/v1/realtime?model=gpt-realtime
    ports:
      - "3334:3334"
    restart: unless-stopped

  frontend:
    build:
      context: ./realtime_frontend
      dockerfile: Dockerfile
    container_name: realtime-frontend
    ports:
      - "5173:5173"
    restart: unless-stopped